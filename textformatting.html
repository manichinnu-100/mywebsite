<!DOCTYPE html>
<html>
    <head>
        <title>Text formatting</title>
    </head>
    <body>
        <pre>THIS IS <b>BOLD</b> TEXT</pre>
        <pre>THIS IS <i>ITALIC</i> TEXT</pre>
        <pre>THIS IS <u>UNDERLINED</u> TEXT</pre>
        <pre>THIS IS <del>DELETED</del> TEXT</pre>
        <pre>THIS IS <big>BIG</big> TEXT</pre>
        <pre>THIS IS <small>SMALL</small> TEXT</pre>
        <pre>THIS IS <sub>SUBSCRIPTED</sub> TEXT</pre>
        <pre>THIS IS <sup>superscripted</sup> TEXT</pre>
        <pre>THIS IS <mark>MARKED</mark> TEXT</pre>
        <pre>THIS MANVIBE<sup>TM</SUP> TEXT</pre>
    </body>
</html>
